# build-check: builds the web app on every push so build errors are visible (free for public repos).
# It only builds and reports; it publishes nothing.
name: build-check
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (clean, from package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Type check (report only)
        run: npx tsc --noEmit -p tsconfig.app.json || true
